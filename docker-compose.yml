services:
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      TRADEGPT_ENV: production
      DATABASE_URL: postgresql://tradegpt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/tradegpt
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      TRADEGPT_ENV: production
      TRADEGPT_WORKER_POLL_SECONDS: ${TRADEGPT_WORKER_POLL_SECONDS:-15}
      DATABASE_URL: postgresql://tradegpt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/tradegpt
    command: ["python", "-m", "tradegpt.worker_main"]
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: tradegpt
      POSTGRES_USER: tradegpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - tradegpt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegpt -d tradegpt"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tradegpt_pgdata:
