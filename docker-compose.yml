services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRADEGPT_ENV: production
      DATABASE_URL: postgresql://tradegpt:${POSTGRES_PASSWORD}@db:5432/tradegpt
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build: .
    restart: unless-stopped
    environment:
      TRADEGPT_ENV: production
      TRADEGPT_WORKER_POLL_SECONDS: ${TRADEGPT_WORKER_POLL_SECONDS:-15}
      DATABASE_URL: postgresql://tradegpt:${POSTGRES_PASSWORD}@db:5432/tradegpt
    command: ["python", "-m", "tradegpt.worker_main"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradegpt
      POSTGRES_USER: tradegpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tradegpt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegpt -d tradegpt"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tradegpt_pgdata:
