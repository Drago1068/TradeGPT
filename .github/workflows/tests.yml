name: TradeGPT tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tradegpt
          POSTGRES_USER: tradegpt
          POSTGRES_PASSWORD: tradegpt-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradegpt -d tradegpt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+psycopg://tradegpt:tradegpt-ci@127.0.0.1:5432/tradegpt
        run: pytest tests/test_postgres_integration.py

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, postgres-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tradegpt:test
